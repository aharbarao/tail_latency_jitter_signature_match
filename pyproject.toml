[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aharbarao-tail_latency_jitter_signature_match"
version = "0.1.0"
description = "通过字符级与结构级特征识别具身智能算法工程师·尾延迟抖动与首 token 时间的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "aharbarao" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://aharbarao.github.io"
Repository = "https://github.com/aharbarao/tail_latency_jitter_signature_match"
Issues = "https://github.com/aharbarao/tail_latency_jitter_signature_match/issues"

[project.scripts]
tail_latency_jitter_signature_match = "tail_latency_jitter_signature_match:main"

[tool.setuptools]
py-modules = ["tail_latency_jitter_signature_match"]
